name: 'claims_policy_assistant'
version: '1.0.0'
config-version: 2

profile: 'claims_policy_assistant'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  claims_policy_assistant:
    +quote_columns: false
    providers:
      +column_types:
        npi: varchar
    claims:
      +column_types:
        denial_reason_code: varchar
        denial_reason_desc: varchar

models:
  claims_policy_assistant:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
